<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>误言的预设小屋</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#191919;--muted:#999;--line:#303030;--accent:#d5ff50;--accent-rgb:213,255,80}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#f5f5f5;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;outline:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(16,16,16,.95);backdrop-filter:blur(10px);z-index:50}
.logo{font-size:24px;font-weight:850;letter-spacing:-1px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo .mark{color:var(--accent)}
.logo img{height:30px;width:auto;max-width:140px;object-fit:contain;display:none}
nav{display:flex;gap:20px;font-size:14px}
nav a{color:var(--muted)}
nav a:hover{color:var(--text)}
.btn{background:var(--accent);color:#111;border:0;padding:12px 17px;border-radius:9px;font-weight:700;font-size:13px}
.btn-ghost{background:transparent;border:1px solid var(--line);color:#f5f5f5;padding:10px 15px;border-radius:9px;font-weight:600;font-size:13px}
main{max-width:1120px;margin:auto;padding:44px 20px 100px}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:2px;font-weight:700}
h1{font-size:clamp(36px,7vw,64px);line-height:1.05;letter-spacing:-2px;font-weight:850;margin-top:10px}
h1 .hl{color:var(--accent)}
.muted{color:var(--muted)}
.sub{color:var(--muted);margin-top:14px;max-width:520px}
.search{display:flex;gap:10px;margin:30px 0 20px}
input{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;min-width:0;font-size:14px}
input:focus{border-color:var(--accent)}
.search input{flex:1}
.categories{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 30px}
.chip{padding:9px 13px;border:1px solid var(--line);border-radius:30px;background:transparent;color:#ddd;font-size:13px;font-weight:600}
.chip.active{background:var(--accent);color:#111;border-color:var(--accent)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.section-head h2{font-size:22px;font-weight:800;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:rgba(var(--accent-rgb),.45)}
.art{aspect-ratio:1.5;display:grid;place-items:center;background:linear-gradient(135deg,#292929,#41413a);font-size:25px;font-weight:800;letter-spacing:-1px;overflow:hidden;position:relative}
.art img{width:100%;height:100%;object-fit:cover}
.art span{color:var(--accent)}
.tag{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.65);padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;z-index:2}
.tag.free{background:#fff;color:#000}
.info{padding:16px;display:flex;flex-direction:column;flex:1}
.info h3{font-size:15px;margin-bottom:5px;line-height:1.35}
.meta{color:var(--muted);font-size:13px}
.card-actions{display:flex;gap:8px;margin-top:15px;align-items:center}
.secondary{flex:1;padding:10px;background:transparent;border:1px solid var(--line);color:#fff;border-radius:8px;font-size:12.5px;font-weight:600}
.price{font-size:15px;font-weight:800;white-space:nowrap}
.price.free{color:var(--accent)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:16px;font-weight:700;color:#f5f5f5;margin-bottom:6px}
.faq{margin-top:56px}
.faq-item{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--panel);overflow:hidden}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 17px;background:none;border:none;color:#f5f5f5;font-family:inherit;font-size:14px;font-weight:700;text-align:left;cursor:pointer}
.faq-q .ic{color:var(--accent);font-size:18px;flex-shrink:0;transition:.25s}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease}
.faq-a p{padding:0 17px 15px;color:var(--muted);font-size:13px;line-height:1.7}
footer{border-top:1px solid var(--line);padding:28px 5%;color:var(--muted);display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:13px}
dialog{background:#1a1a1a;color:#fff;border:1px solid #444;border-radius:16px;width:min(760px,calc(100% - 24px));padding:0;max-height:90vh}
dialog::backdrop{background:#000c}
.dlg-close{position:sticky;top:10px;margin-left:auto;display:block;background:rgba(0,0,0,.6);border:1px solid #444;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;z-index:5;cursor:pointer}
.gallery{background:#111}
.main-img{width:100%;height:240px;object-fit:contain;display:block;background:#111}
.no-img{height:190px;display:grid;place-items:center;font-size:44px;font-weight:900;color:#fff}
.thumbs{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:#141414}
.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.thumbs img.on{border-color:var(--accent)}
.dlg-body{padding:20px 22px}
.dlg-body .cat{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:700}
.dlg-body h2{font-size:22px;margin:6px 0 10px}
.dlg-body .desc{color:var(--muted);font-size:13.5px;line-height:1.8;white-space:pre-wrap;margin:0 0 16px}
.video-wrap{position:relative;padding-top:56.25%;margin:0 0 14px;background:#000;border-radius:10px;overflow:hidden}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.dlg-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.like-btn{background:var(--panel);border:1px solid var(--line);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px}
.like-btn.on{background:var(--accent);color:#111;border-color:var(--accent)}
.comments{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.comments h4{font-size:14px;margin-bottom:8px}
.comment{padding:9px 0;border-bottom:1px solid var(--line)}
.comment-meta{font-size:11px;color:var(--muted);margin-bottom:3px}
.comment-text{font-size:13px;line-height:1.7;white-space:pre-wrap}
.comment-form{display:flex;gap:8px;margin-top:10px}
.comment-form input{flex:1;height:38px;padding:0 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:#fff;font-size:13px}
.comment-form button{background:var(--accent);color:#111;border:0;border-radius:8px;padding:0 14px;font-weight:700;font-size:13px}
.modal-form{padding:24px}
.modal-form label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
.modal-form input{width:100%;height:42px}
.form-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
.form-switch span{color:var(--accent);cursor:pointer;font-weight:700}
.order-box{border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#111;padding:11px 20px;border-radius:9px;font-weight:700;font-size:13px;z-index:999;transition:.3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:700px){header{padding:0 18px}nav{gap:12px;font-size:13px}main{padding:30px 16px 70px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.info{padding:11px}.info h3{font-size:14px}.search{flex-wrap:wrap}.search input{flex-basis:100%}}
@media(max-width:390px){nav{gap:8px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="window.scrollTo({top:0,behavior:'smooth'})"><img id="logoImg" alt=""><span class="mark">✦</span> <span class="site-name">误言的预设小屋</span></div>
  <nav><a href="#resources">Resources</a><a href="#faq">FAQ</a><a href="admin.html">Admin</a></nav>
  <div style="display:flex;gap:8px"><button class="btn-ghost" id="authBtn" onclick="openAuth('login')">登录</button></div>
</header>

<main>
  <div class="eyebrow" id="eyebrow">CREATIVE RESOURCE LIBRARY</div>
  <h1 id="heroTitle">Make something<br><span class="hl">remarkable.</span></h1>
  <p class="sub" id="heroDesc">高质量 AE 预设、模板和工程文件，即买即用。</p>

  <div class="search">
    <input id="query" placeholder="搜索资源..." aria-label="搜索资源">
    <button class="btn" onclick="render()">搜索</button>
  </div>

  <div class="categories" id="categories"></div>

  <section id="resources">
    <div class="section-head"><h2 id="productsTitle">全部资源</h2><span class="muted" id="count"></span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="faq" id="faq">
    <div class="section-head"><h2 id="faqTitle">常见问题</h2></div>
    <div id="faqList"></div>
  </section>
</main>

<footer id="footer">
  <span>© 2026 <span class="site-name">误言的预设小屋</span></span>
  <span id="footerAbout">独立演示 · 仅供学习</span>
</footer>

<dialog id="detail"><button class="dlg-close" onclick="document.getElementById('detail').close()">关闭</button><div id="detailBody"></div></dialog>
<dialog id="authDlg"><div class="modal-form"><h2 id="authTitle" style="font-size:20px;margin-bottom:4px">登录</h2><div class="muted" style="font-size:12px;margin-bottom:14px">登录后可以购买、点赞、评论</div><label>邮箱</label><input type="email" id="authEmail"><label>密码</label><input type="password" id="authPass"><button class="btn" style="width:100%;margin-top:14px;padding:11px" onclick="doAuth()" id="authSubmit">登录</button><div class="form-switch"><span id="authSwitch" onclick="openAuth(authMode==='login'?'register':'login')">没有账号？立即注册</span></div></div></dialog>
<dialog id="payDlg"><div class="modal-form" id="payBody"></div></dialog>
<dialog id="myDlg"><div class="modal-form"><h2 style="font-size:20px;margin-bottom:4px">我的账号</h2><div id="myEmail" style="font-size:13px;color:var(--muted);margin-bottom:12px"></div><div id="myBody"></div><button class="btn-ghost" style="width:100%;margin-top:14px;padding:10px" onclick="logout()">退出</button></div></dialog>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
let currentUser=null,products=[],settings={},activeCat='全部',authMode='login';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])).replace(/`/g,'&#96;').replace(/\$\{/g,'$&#123;');
const FONTS={system:'-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif',heiti:'"PingFang SC","Microsoft YaHei",sans-serif',songti:'"Songti SC",SimSun,serif',kaiti:'"Kaiti SC",KaiTi,serif',yuanti:'"Yuanti SC","YouYuan",sans-serif'};
function hexToRgb(h){const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h||'');return m?`${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}`:null;}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2500);}
function show(k,def=true){return settings[k]===undefined?def:settings[k]==='1';}

(async()=>{const {data:{session}}=await sb.auth.getSession();currentUser=session?.user||null;sb.auth.onAuthStateChange((e,s)=>{currentUser=s?.user||null;updateAuth();});await loadSettings();await loadProducts();updateAuth();})();

async function loadSettings(){
 const {data}=await sb.from('settings').select('*');(data||[]).forEach(r=>settings[r.key]=r.value);
 const root=document.documentElement.style;
 if(settings.theme_accent){root.setProperty('--accent',settings.theme_accent);const rgb=hexToRgb(settings.theme_accent);if(rgb)root.setProperty('--accent-rgb',rgb);}
 if(settings.theme_bg)root.setProperty('--bg',settings.theme_bg);
 document.body.style.fontFamily=FONTS[settings.theme_font]||FONTS.system;
 if(settings.font_url){const st=document.createElement('style');st.textContent=`@font-face{font-family:'SiteFont';src:url('${settings.font_url}');font-display:swap;}`;document.head.appendChild(st);document.body.style.fontFamily="'SiteFont',"+FONTS.system;}
 if(settings.favicon_url){let l=document.querySelector("link[rel='icon']");if(!l){l=document.createElement('link');l.rel='icon';document.head.appendChild(l);}l.href=settings.favicon_url;}
 if(settings.logo_url){const lg=document.getElementById('logoImg');lg.src=settings.logo_url;lg.style.display='block';}
 document.querySelectorAll('.site-name').forEach(e=>{if(settings.site_name)e.textContent=settings.site_name;});
 if(settings.site_name)document.title=settings.site_name;
 if(settings.hero_title){const lines=settings.hero_title.split('\n');document.getElementById('heroTitle').innerHTML=lines.map((l,i)=>i===lines.length-1?`<span class="hl">${esc(l)}</span>`:esc(l)).join('<br>');}
 if(settings.hero_desc)document.getElementById('heroDesc').textContent=settings.hero_desc;
 if(settings.badge_text)document.getElementById('eyebrow').textContent=settings.badge_text;
 if(settings.search_placeholder)document.getElementById('query').placeholder=settings.search_placeholder;
 if(settings.products_title)document.getElementById('productsTitle').textContent=settings.products_title;
 if(settings.footer_about)document.getElementById('footerAbout').textContent=settings.footer_about;
 if(settings.faq_title)document.getElementById('faqTitle').textContent=settings.faq_title;
 document.getElementById('faq').style.display=show('faq_show')?'block':'none';
 renderFaq();
}
function renderFaq(){const raw=settings.faq_text||'';const items=raw.split('\n').filter(Boolean).map(line=>{const i=line.indexOf('|');return i<0?{q:line.trim(),a:''}:{q:line.slice(0,i).trim(),a:line.slice(i+1).trim()};});document.getElementById('faqList').innerHTML=items.map(it=>`<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">${esc(it.q)}<span class="ic">+</span></button><div class="faq-a"><p>${esc(it.a)}</p></div></div>`).join('');}
function toggleFaq(btn){const item=btn.parentElement;const ans=item.querySelector('.faq-a');const open=item.classList.contains('open');document.querySelectorAll('.faq-item').forEach(i=>{i.classList.remove('open');i.querySelector('.faq-a').style.maxHeight=null;i.querySelector('.ic').style.transform='none';});if(!open){item.classList.add('open');ans.style.maxHeight=ans.scrollHeight+'px';item.querySelector('.ic').style.transform='rotate(45deg)';}}
async function loadProducts(){const {data}=await sb.from('products').select('*').eq('status','published').order('created_at',{ascending:false});products=data||[];renderCats();render();}
function renderCats(){const cats=['全部',...new Set(products.map(p=>p.category).filter(Boolean)),'免费'];document.getElementById('categories').innerHTML=cats.map(c=>`<button class="chip ${activeCat===c?'active':''}" data-cat="${esc(c)}" onclick="setCat(this.dataset.cat)">${esc(c)}</button>`).join('');}
function setCat(c){activeCat=c;renderCats();render();}
function imgs(p){let a=[];try{a=JSON.parse(p.images||'[]');}catch(e){}if(!Array.isArray(a))a=[];if(!a.length&&p.cover_url)a=[p.cover_url];return a;}
function render(){
 const q=(document.getElementById('query').value||'').trim().toLowerCase();
 const list=products.filter(p=>{
  const okCat=activeCat==='全部'?true:(activeCat==='免费'?Number(p.price)===0:p.category===activeCat);
  const okQ=!q||(p.title||'').toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q);
  return okCat&&okQ;
 });
 document.getElementById('count').textContent=list.length+' 个资源';
 const grid=document.getElementById('grid');
 if(!list.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="big">没有找到资源</div>换个关键词试试</div>';return;}
 grid.innerHTML=list.map(p=>{
  const price=Number(p.price)||0;const im=imgs(p);
  const art=im.length?`<div class="art"><img src="${esc(im[0])}" alt="${esc(p.title)}">${price===0?'<span class="tag free">免费</span>':''}</div>`:`<div class="art">${esc(p.glyph||'AE')}${price===0?'<span class="tag free">免费</span>':''}</div>`;
  return `<article class="card" onclick="openDetail(${p.id})">${art}<div class="info"><h3>${esc(p.title)}</h3><div class="meta">${esc(p.category||'资源')}</div><div class="card-actions"><div class="price ${price===0?'free':''}">${price===0?'免费':'¥'+price}</div><button class="secondary" onclick="event.stopPropagation();openDetail(${p.id})">查看详情</button></div></div></article>`;
 }).join('');
}
function openDetail(id){
 const p=products.find(x=>String(x.id)===String(id));if(!p)return;
 const im=imgs(p);
 const gallery=im.length?`<div class="gallery"><img id="mainImg" class="main-img" src="${esc(im[0])}" alt="${esc(p.title)}"><div class="thumbs">${im.map((u,i)=>`<img src="${esc(u)}" class="${i===0?'on':''}" onclick="switchImg('${esc(u)}',this)">`).join('')}</div></div>`:`<div class="no-img" style="background:linear-gradient(135deg,#292929,#41413a)">${esc(p.glyph||'AE')}</div>`;
 const video=p.video_url?`<div class="video-wrap"><iframe src="${esc(p.video_url)}" allowfullscreen loading="lazy"></iframe></div>`:'';
 const price=Number(p.price)||0;
 document.getElementById('detailBody').innerHTML=`${gallery}<div class="dlg-body"><div class="cat">${esc(p.category||'资源')}</div><h2>${esc(p.title)}</h2><p class="desc">${esc(p.description||'暂无介绍')}</p>${video}<div class="dlg-foot"><div class="price ${price===0?'free':''}" style="font-size:22px">${price===0?'免费':'¥'+price}</div><button class="btn" onclick="buy(${p.id})">${price===0?'免费下载':'立即购买'}</button><button class="like-btn" id="likeBtn" onclick="toggleLike(${p.id})">点赞</button></div><div class="comments"><h4>评论</h4><div id="commentsBox" style="color:var(--muted);font-size:12.5px">加载中…</div><div class="comment-form"><input id="commentInput" placeholder="写评论…（审核后显示）"><button onclick="postComment(${p.id})">发表</button></div></div></div>`;
 document.getElementById('detail').showModal();loadLikes(p.id);loadComments(p.id);
}
function switchImg(u,el){document.getElementById('mainImg').src=u;document.querySelectorAll('.thumbs img').forEach(i=>i.classList.remove('on'));el.classList.add('on');}
async function loadLikes(pid){try{const {count}=await sb.from('likes').select('*',{count:'exact',head:true}).eq('product_id',pid);let liked=false;if(currentUser){const {data}=await sb.from('likes').select('id').eq('product_id',pid).eq('user_id',currentUser.id).maybeSingle();liked=!!data;}const el=document.getElementById('likeBtn');if(el){el.classList.toggle('on',liked);el.textContent=(liked?'已点赞':'点赞')+' '+(count||0);}}catch(e){}}
async function toggleLike(pid){if(!currentUser){toast('请先登录');openAuth('login');return;}const {data}=await sb.from('likes').select('id').eq('product_id',pid).eq('user_id',currentUser.id).maybeSingle();if(data){await sb.from('likes').delete().eq('id',data.id);}else{const {error}=await sb.from('likes').insert({user_id:currentUser.id,product_id:pid});if(error){toast('操作失败');return;}}loadLikes(pid);}
async function loadComments(pid){const box=document.getElementById('commentsBox');if(!box)return;try{const {data}=await sb.from('comments').select('*').eq('product_id',pid).eq('status','approved').order('created_at',{ascending:false});if(!data||!data.length){box.innerHTML='还没有评论';return;}box.innerHTML=data.map(c=>`<div class="comment"><div class="comment-meta">${new Date(c.created_at).toLocaleString('zh-CN')}</div><div class="comment-text">${esc(c.content)}</div></div>`).join('');}catch(e){box.textContent='评论加载失败';}}
async function postComment(pid){if(!currentUser){toast('请先登录');openAuth('login');return;}const el=document.getElementById('commentInput');const content=(el.value||'').trim();if(!content){toast('请输入评论');return;}const {error}=await sb.from('comments').insert({user_id:currentUser.id,product_id:pid,content,status:'pending'});if(error){toast('提交失败：'+error.message);return;}el.value='';toast('评论已提交，审核后显示');}
async function buy(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;if(!currentUser){toast('请先登录');openAuth('login');return;}const price=Number(p.price)||0;if(price===0){downloadById(p.id);return;}const {data:ex}=await sb.from('orders').select('*').eq('user_id',currentUser.id).eq('product_id',p.id).in('status',['pending','submitted','paid']);if(ex&&ex.length){showPay(p,ex[0]);return;}const {data,error}=await sb.from('orders').insert({user_id:currentUser.id,product_id:p.id,status:'pending'}).select().single();if(error){toast('下单失败：'+error.message);return;}showPay(p,data);}
function showPay(p,o){const price=Number(p.price)||0;const qw=settings.pay_qr_wechat,qa=settings.pay_qr_alipay;let qr='';if(qw||qa){qr=`<div style="display:flex;gap:10px;justify-content:center;margin:12px 0">${qw?`<img src="${esc(qw)}" style="width:130px;height:130px;object-fit:contain;background:#fff;border-radius:10px;padding:4px">`:''}${qa?`<img src="${esc(qa)}" style="width:130px;height:130px;object-fit:contain;background:#fff;border-radius:10px;padding:4px">`:''}</div>`;}else{qr=`<div style="border:2px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--muted);font-size:12px;margin:12px 0">管理员还没上传收款码</div>`;}let act='';if(o.status==='paid')act=`<button class="btn" style="width:100%;padding:11px" onclick="downloadById(${p.id})">下载文件</button>`;else if(o.status==='submitted')act=`<div style="text-align:center;color:#6f9dff;font-size:13px;font-weight:700;margin:10px 0">已提交付款，等待管理员确认…</div>`;else act=`<button class="btn" style="width:100%;padding:11px" onclick="submitPaid(${o.id})">我已完成付款</button>`;document.getElementById('payBody').innerHTML=`<h2 style="font-size:19px;margin-bottom:4px">${esc(p.title)}</h2><div style="color:var(--muted);font-size:13px;margin-bottom:8px">订单金额：<b style="color:var(--accent);font-size:18px">¥${price}</b></div>${qr}<div style="background:var(--panel);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.8"><div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">订单号</span><b>#${o.id}</b></div><div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">联系方式</span><b>${esc(settings.contact||'联系客服')}</b></div></div>${act}<div style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px">付款后点「我已完成付款」，管理员确认后可下载</div>`;document.getElementById('payDlg').showModal();}
async function submitPaid(oid){const {error}=await sb.from('orders').update({status:'submitted'}).eq('id',oid);if(error){toast('提交失败');return;}toast('已提交');document.getElementById('payDlg').close();}
async function downloadById(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;if(!p.file_path){toast('该产品暂未上传文件');return;}toast('开始下载…');const {data,error}=await sb.storage.from('files').download(p.file_path);if(error){toast('下载失败：'+error.message);return;}try{await sb.rpc('increment_download',{pid:p.id});}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=p.file_path.split('/').pop()||'file';document.body.appendChild(a);a.click();a.remove();}
function openAuth(mode){authMode=mode;document.getElementById('authTitle').textContent=mode==='login'?'登录':'注册';document.getElementById('authSubmit').textContent=mode==='login'?'登录':'注册';document.getElementById('authSwitch').textContent=mode==='login'?'没有账号？立即注册':'已有账号？去登录';document.getElementById('authDlg').showModal();}
async function doAuth(){const email=document.getElementById('authEmail').value.trim(),pass=document.getElementById('authPass').value.trim();if(!email||!pass){toast('请填写邮箱密码');return;}if(pass.length<6){toast('密码至少 6 位');return;}const btn=document.getElementById('authSubmit');btn.disabled=true;try{if(authMode==='login'){const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;toast('登录成功');document.getElementById('authDlg').close();}else{const {data,error}=await sb.auth.signUp({email,password:pass});if(error)throw error;toast(data.session?'注册成功':'注册成功，请去邮箱验证');document.getElementById('authDlg').close();}}catch(e){toast('操作失败：'+(e.message||''));}finally{btn.disabled=false;}}
async function logout(){await sb.auth.signOut();toast('已退出');document.getElementById('myDlg').close();}
function updateAuth(){const b=document.getElementById('authBtn');if(currentUser){b.textContent='我的';b.onclick=openMy;}else{b.textContent='登录';b.onclick=()=>openAuth('login');}}
async function openMy(){document.getElementById('myEmail').textContent=currentUser.email;document.getElementById('myBody').innerHTML='加载中…';document.getElementById('myDlg').showModal();const {data:orders}=await sb.from('orders').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false});const ids=[...new Set((orders||[]).map(o=>o.product_id))];let pm={};if(ids.length){const {data:ps}=await sb.from('products').select('*').in('id',ids);(ps||[]).forEach(p=>pm[p.id]=p);}const T={pending:'待付款',submitted:'待确认',paid:'已付款',cancelled:'已取消'};let h='';if(!orders||!orders.length){h='<div style="color:var(--muted);font-size:13px;padding:16px 0">还没有订单</div>';}else{h=orders.map(o=>{const p=pm[o.product_id];const price=p?Number(p.price)||0:0;let act='';if(o.status==='paid'&&p&&p.file_path)act=`<button class="btn" style="padding:7px 12px;font-size:12px;margin-top:7px" onclick="downloadById(${o.product_id})">下载文件</button>`;return `<div class="order-box"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:5px"><b style="font-size:13.5px">${esc(p?p.title:'产品已下架')}</b><span style="font-size:10.5px;font-weight:700;color:var(--accent)">${T[o.status]||o.status}</span></div><div style="font-size:11.5px;color:var(--muted)">#${o.id} · ¥${price} · ${new Date(o.created_at).toLocaleDateString('zh-CN')}</div>${act}</div>`;}).join('');}document.getElementById('myBody').innerHTML=h;}
['detail','authDlg','payDlg','myDlg'].forEach(id=>{const d=document.getElementById(id);if(d)d.addEventListener('click',e=>{if(e.target===d)d.close();});});
</script>
</body>

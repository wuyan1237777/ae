<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台</title>
<style>
:root{--bg:#0b0b0c;--panel:#141416;--panel2:#1b1b1e;--line:rgba(255,255,255,.09);--text:#f4f4f2;--muted:#9c9ca6;--accent:#c8f62e}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
.container{max-width:1000px;margin:0 auto;padding:0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:8px;font-size:13px;padding:8px 14px;white-space:nowrap}
.btn-accent{background:var(--accent);color:#000}.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12px}
input,select,textarea{width:100%;padding:9px 11px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;outline:none}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
textarea{min-height:70px;resize:vertical}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#000;padding:11px 20px;border-radius:8px;font-weight:700;font-size:13px;z-index:999;transition:.3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 22px;width:100%;max-width:350px}
.login-card h1{font-size:17px;font-weight:700;margin-bottom:16px}
#panelView{display:none;padding-bottom:50px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(11,11,12,.95);border-bottom:1px solid var(--line);padding:11px 0}
.topbar .inner{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px}.who{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:5px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line)}
.tab{padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
main{padding:16px 0}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar h3{font-size:16px;font-weight:700}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:14px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px}
.sc .n{font-size:22px;font-weight:700}.sc .n.a{color:var(--accent)}
.sc .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px}
.pc{width:44px;height:44px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0;color:#fff;overflow:hidden;background-size:cover;background-position:center}
.pi{flex:1;min-width:0}.pt{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:11px;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:36px 0;font-size:13px}
.oi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:8px}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ot{font-weight:600;font-size:13.5px}.om{font-size:11.5px;color:var(--muted);line-height:1.7;white-space:pre-wrap}
.oa{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.st{font-size:10.5px;padding:2px 8px;border-radius:5px;font-weight:600;white-space:nowrap}
.st-pending{background:rgba(255,180,0,.15);color:#ffb400}.st-submitted{background:rgba(80,140,255,.15);color:#6f9dff}
.st-paid{background:rgba(200,246,46,.15);color:#c8f62e}.st-cancelled{background:rgba(255,255,255,.08);color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px;margin-bottom:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cr input[type=color]{width:50px;height:40px;padding:3px}
.pv{width:100%;max-width:220px;border-radius:6px;margin-top:7px;display:none}
.cp{width:110px;height:72px;object-fit:cover;border-radius:6px;margin-top:6px;display:none}
.imgs-prev{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.imgs-prev img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.qp img{width:90px;height:90px;object-fit:contain;background:#fff;border-radius:6px;padding:4px;margin:6px 8px 0 0}
.hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55}
.faq-row{border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px;background:var(--panel2)}
.faq-row .del{background:transparent;border:1px solid var(--line);color:#ff6b6b;border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;margin-top:6px;font-family:inherit}
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;pointer-events:none;transition:.25s}
.modal.show{opacity:1;pointer-events:auto}
.mb{position:absolute;inset:0;background:rgba(0,0,0,.85)}
.mbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:20px}
.mc{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
@media(max-width:560px){.g2{grid-template-columns:1fr}.sg{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="loginView"><div class="login-card">
<h1>管理后台</h1>
<label>邮箱</label><input type="email" id="loginEmail">
<label>密码</label><input type="password" id="loginPass">
<button class="btn btn-accent" style="width:100%;margin-top:16px" onclick="doLogin()">登录</button>
<div style="text-align:center;margin-top:12px;font-size:12px"><a href="index.html" style="color:var(--muted)">返回前台</a></div>
</div></div>

<div id="panelView">
<div class="topbar"><div class="container inner"><div class="brand">管理后台</div>
<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span class="who" id="whoEmail"></span><a href="index.html" target="_blank" class="btn btn-ghost sm">前台</a><button class="btn btn-ghost sm" onclick="logout()">退出</button></div>
</div></div>
<div class="container"><div class="tabs">
<button class="tab active" data-tab="overview" onclick="switchTab('overview')">概览</button>
<button class="tab" data-tab="products" onclick="switchTab('products')">产品</button>
<button class="tab" data-tab="orders" onclick="switchTab('orders')">订单</button>
<button class="tab" data-tab="comments" onclick="switchTab('comments')">评论</button>
<button class="tab" data-tab="membership" onclick="switchTab('membership')">会员</button>
<button class="tab" data-tab="polls" onclick="switchTab('polls')">投票</button>
<button class="tab" data-tab="submissions" onclick="switchTab('submissions')">投稿</button>
<button class="tab" data-tab="settings" onclick="switchTab('settings')">设置</button>
</div><main id="tabContent"></main></div></div>

<div class="modal" id="pModal" onclick="if(event.target===this||event.target.classList.contains('mb'))closePF()"><div class="mb"></div><div class="mbox">
<button class="mc" onclick="closePF()">X</button>
<h3 id="pTitle">新增产品</h3>
<label>产品名称</label><input id="fTitle">
<div class="g2"><div><label>分类</label><select id="fCategory"><option>预设</option><option>工程文件</option><option>模板</option><option>调色LUT</option><option>转场</option></select></div><div><label>状态</label><select id="fStatus"><option value="published">上架</option><option value="hidden">下架</option></select></div></div>
<div class="g2"><div><label>价格（0=免费）</label><input id="fPrice" type="number" min="0" step="0.01" value="0"></div><div><label>原价</label><input id="fOldPrice" type="number" min="0" step="0.01"></div></div>
<label>视频链接（可选）</label><input id="fVideo">
<label>产品图片（可多选）</label><input type="file" id="fImages" accept="image/*" multiple style="padding:7px">
<div class="imgs-prev" id="imgsPrev"></div>
<div class="hint" id="imgHint">支持多张，第一张作封面</div>
<label>单张封面（可选）</label><input type="file" id="fCover" accept="image/*" style="padding:7px">
<img id="coverPrev" class="cp">
<div class="g2"><div><label>封面大字</label><input id="fGlyph"></div><div><label>封面颜色</label><input id="fColor" type="color" value="#1b1b1e" style="height:40px;padding:3px"></div></div>
<label>产品介绍</label><textarea id="fDesc"></textarea>
<label>预设文件</label><input type="file" id="fFile" style="padding:7px">
<div class="hint" id="fFileInfo"></div>
<button class="btn btn-accent" style="width:100%;margin-top:16px" onclick="saveProduct()" id="saveBtn">保存</button>
</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
const ADMIN=(window.ADMIN_EMAIL||'').toLowerCase();
let currentUser=null,products=[],orders=[],comments=[],membershipOrders=[],plans=[],polls=[],pollOptions=[],submissions=[];
let profilesMap={},prodMap={},settings={},editingId=null,curTab='overview',faqRows=[];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])).replace(/`/g,'&#96;').replace(/\$\{/g,'$&#123;');
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2500);}
const openM=id=>document.getElementById(id).classList.add('show');
const closeM=id=>document.getElementById(id).classList.remove('show');
const TEXT_FIELDS=[['site_name','店铺名称'],['site_tagline','副标题'],['announcement','顶部公告'],['badge_text','首屏徽章'],['hero_title','首屏大标题（换行）','textarea'],['hero_desc','首屏介绍','textarea'],['btn_browse','主按钮文字'],['btn_free','次按钮文字'],['stat_creators','统计1数字'],['stat_label1','统计1标签'],['stat_label2','统计2标签'],['stat_rating','统计3数字'],['stat_label3','统计3标签'],['marquee_items','跑马灯文字（逗号分隔）','textarea'],['products_title','产品区标题'],['products_sub','产品区副标题'],['search_placeholder','搜索框提示'],['perk1_icon','卖点1图标'],['perk1_title','卖点1标题'],['perk1_desc','卖点1描述'],['perk2_icon','卖点2图标'],['perk2_title','卖点2标题'],['perk2_desc','卖点2描述'],['perk3_icon','卖点3图标'],['perk3_title','卖点3标题'],['perk3_desc','卖点3描述'],['perk4_icon','卖点4图标'],['perk4_title','卖点4标题'],['perk4_desc','卖点4描述'],['rank_title','排行榜标题'],['faq_title','FAQ标题'],['faq_sub','FAQ副标题'],['footer_about','页脚简介','textarea'],['copyright_text','版权文字']];
const TOGGLE_FIELDS=[['badge_show','显示徽章'],['stats_show','显示统计'],['marquee_show','显示跑马灯'],['perks_show','显示卖点区'],['rank_show','显示排行榜'],['faq_show','显示常见问题']];
(async()=>{const {data:{session}}=await sb.auth.getSession();currentUser=session?.user||null;sb.auth.onAuthStateChange((e,s)=>{currentUser=s?.user||null;evaluate();});evaluate();})();
function evaluate(){const ok=currentUser&&(currentUser.email||'').toLowerCase()===ADMIN;document.getElementById('loginView').style.display=ok?'none':'flex';document.getElementById('panelView').style.display=ok?'block':'none';if(ok){document.getElementById('whoEmail').textContent=currentUser.email;if(!products.length)loadAll();}}
async function doLogin(){const email=document.getElementById('loginEmail').value.trim(),pass=document.getElementById('loginPass').value.trim();if(!email||!pass){toast('请输入邮箱密码');return;}const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error){toast('登录失败：'+error.message);return;}if(email.toLowerCase()!==ADMIN){toast('不是管理员账号');await sb.auth.signOut();return;}toast('登录成功');}
async function logout(){await sb.auth.signOut();toast('已退出');}
async function loadAll(){
 const [s,p,o,pr,c,mo,pl,po,pv,su]=await Promise.all([
  sb.from('settings').select('*'),sb.from('products').select('*').order('created_at',{ascending:false}),
  sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('*'),
  sb.from('comments').select('*').order('created_at',{ascending:false}),
  sb.from('membership_orders').select('*').order('created_at',{ascending:false}),
  sb.from('membership_plans').select('*'),
  sb.from('polls').select('*').order('created_at',{ascending:false}),
  sb.from('poll_options').select('*'),sb.from('submissions').select('*').order('created_at',{ascending:false})
 ]);
 settings={};(s.data||[]).forEach(r=>settings[r.key]=r.value);
 products=p.data||[];orders=o.data||[];comments=c.data||[];
 membershipOrders=mo.data||[];plans=pl.data||[];polls=po.data||[];pollOptions=pv.data||[];submissions=su.data||[];
 profilesMap={};(pr.data||[]).forEach(r=>profilesMap[r.id]=r.email);
 prodMap={};products.forEach(x=>prodMap[x.id]=x);faqRows=[];renderTab();
}
function switchTab(t){curTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderTab();}
function renderTab(){({overview:renderOverview,products:renderProducts,orders:renderOrders,comments:renderComments,membership:renderMembership,polls:renderPolls,submissions:renderSubmissions,settings:renderSettings}[curTab]||renderOverview)();}
function renderOverview(){const pend=orders.filter(o=>o.status==='submitted').length;const rev=orders.filter(o=>o.status==='paid').reduce((s,o)=>{const p=prodMap[o.product_id];return s+(p?Number(p.price)||0:0);},0);const dl=products.reduce((s,p)=>s+(p.downloads||0),0);document.getElementById('tabContent').innerHTML=`<div class="sg"><div class="sc"><div class="n">${products.length}</div><div class="l">产品</div></div><div class="sc"><div class="n">${orders.length}</div><div class="l">订单</div></div><div class="sc"><div class="n a">${pend}</div><div class="l">待确认</div></div><div class="sc"><div class="n a">¥${rev}</div><div class="l">已收款</div></div><div class="sc"><div class="n">${dl}</div><div class="l">下载</div></div><div class="sc"><div class="n a">${membershipOrders.filter(o=>o.status==='submitted').length}</div><div class="l">待确认会员</div></div><div class="sc"><div class="n">${submissions.filter(s=>s.status==='pending').length}</div><div class="l">待审投稿</div></div></div>`;}
function renderProducts(){let h=`<div class="bar"><h3>产品 ${products.length}</h3><button class="btn btn-accent" onclick="openPF()">新增</button></div>`;if(!products.length)h+='<div class="empty">暂无产品</div>';else h+='<div class="plist">'+products.map(p=>{const bg=p.cover_url?`background-image:url('${esc(p.cover_url)}')`:`background:${esc(p.cover_color||'#1b1b1e')}`;return `<div class="prow"><div class="pc" style="${bg}">${p.cover_url?'':esc(p.glyph||'AE')}</div><div class="pi"><div class="pt">${esc(p.title)}</div><div class="pm">${esc(p.category||'-')} / ${Number(p.price)===0?'免费':'¥'+Number(p.price)} / ${p.status}</div></div><div style="display:flex;gap:5px;flex-direction:column"><button class="btn btn-ghost sm" onclick="openPF(${p.id})">编辑</button><button class="btn btn-ghost sm" onclick="delProduct(${p.id})">删除</button></div></div>`;}).join('')+'</div>';document.getElementById('tabContent').innerHTML=h;}
function openPF(id){editingId=id||null;const p=id?products.find(x=>x.id===id):null;document.getElementById('pTitle').textContent=id?'编辑产品':'新增产品';document.getElementById('fTitle').value=p?.title||'';document.getElementById('fCategory').value=p?.category||'预设';document.getElementById('fStatus').value=p?.status||'published';document.getElementById('fPrice').value=p?.price??0;document.getElementById('fOldPrice').value=p?.old_price??'';document.getElementById('fVideo').value=p?.video_url||'';document.getElementById('fGlyph').value=p?.glyph||'';document.getElementById('fColor').value=p?.cover_color||'#1b1b1e';document.getElementById('fDesc').value=p?.description||'';document.getElementById('fFile').value='';document.getElementById('fCover').value='';document.getElementById('fImages').value='';const cp=document.getElementById('coverPrev');if(p?.cover_url){cp.src=p.cover_url;cp.style.display='block';}else{cp.style.display='none';cp.src='';}openM('pModal');}
function closePF(){closeM('pModal');editingId=null;}
document.getElementById('fCover').addEventListener('change',function(){const cp=document.getElementById('coverPrev');if(this.files[0]){cp.src=URL.createObjectURL(this.files[0]);cp.style.display='block';}});
async function saveProduct(){const title=document.getElementById('fTitle').value.trim();if(!title){toast('请填写产品名称');return;}const btn=document.getElementById('saveBtn'),old=btn.textContent;btn.textContent='保存中...';btn.disabled=true;try{const payload={title,category:document.getElementById('fCategory').value,price:Number(document.getElementById('fPrice').value)||0,old_price:document.getElementById('fOldPrice').value?Number(document.getElementById('fOldPrice').value):null,video_url:document.getElementById('fVideo').value.trim()||null,glyph:document.getElementById('fGlyph').value.trim()||'AE',cover_color:document.getElementById('fColor').value,description:document.getElementById('fDesc').value,status:document.getElementById('fStatus').value};let id=editingId;if(id){const {error}=await sb.from('products').update(payload).eq('id',id);if(error)throw error;}else{const {data,error}=await sb.from('products').insert(payload).select().single();if(error)throw error;id=data.id;}const ii=document.getElementById('fImages');if(ii.files&&ii.files.length){toast('上传图片...');const urls=[];for(const f of ii.files){const path='img_'+id+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+f.name.split('.').pop();const {error:ie}=await sb.storage.from('covers').upload(path,f,{upsert:true});if(!ie){const {data:pu}=sb.storage.from('covers').getPublicUrl(path);urls.push(pu.publicUrl);}}if(urls.length){const {error:ime}=await sb.from('products').update({images:JSON.stringify(urls),cover_url:urls[0]}).eq('id',id);if(ime)throw new Error('图片保存失败，请先跑升级 SQL');}}const ci=document.getElementById('fCover');if(ci.files&&ci.files[0]){const f=ci.files[0],path='cover_'+id+'_'+Date.now()+'.'+f.name.split('.').pop();const {error:ce}=await sb.storage.from('covers').upload(path,f,{upsert:true});if(ce)throw new Error(ce.message);const {data:cu}=sb.storage.from('covers').getPublicUrl(path);await sb.from('products').update({cover_url:cu.publicUrl}).eq('id',id);}const fi=document.getElementById('fFile');if(fi.files&&fi.files[0]){const f=fi.files[0],path=id+'/'+f.name;const {error:fe}=await sb.storage.from('files').upload(path,f,{upsert:true});if(fe)throw new Error(fe.message);await sb.from('products').update({file_path:path}).eq('id',id);}toast('已保存');closePF();await loadAll();}catch(e){toast(e.message||'保存失败');}finally{btn.textContent=old;btn.disabled=false;}}
async function delProduct(id){if(!confirm('确定删除这个产品吗？'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error){toast('删除失败：'+error.message);return;}toast('已删除');await loadAll();}
function renderOrders(){const T={pending:'待付款',submitted:'待确认',paid:'已付款',cancelled:'已取消'},C={pending:'st-pending',submitted:'st-submitted',paid:'st-paid',cancelled:'st-cancelled'};let h=`<div class="bar"><h3>订单 ${orders.length}</h3></div>`;if(!orders.length)h+='<div class="empty">暂无订单</div>';else h+=orders.map(o=>{const p=prodMap[o.product_id],title=p?p.title:'产品已删除',price=p?Number(p.price)||0:0,email=profilesMap[o.user_id]||'...';let a='';if(o.status==='submitted')a=`<button class="btn btn-accent sm" onclick="setOrder(${o.id},'paid')">确认收款</button><button class="btn btn-ghost sm" onclick="setOrder(${o.id},'cancelled')">取消</button>`;else if(o.status==='pending')a=`<button class="btn btn-ghost sm" onclick="setOrder(${o.id},'cancelled')">取消</button>`;else if(o.status==='paid')a=`<button class="btn btn-ghost sm" onclick="setOrder(${o.id},'cancelled')">撤销</button>`;return `<div class="oi"><div class="oh"><span class="ot">${esc(title)}</span><span class="st ${C[o.status]||''}">${T[o.status]||o.status}</span></div><div class="om">#${o.id} / ¥${price} / ${esc(email)}<br>${new Date(o.created_at).toLocaleString('zh-CN')}</div>${a?`<div class="oa">${a}</div>`:''}</div>`;}).join('');document.getElementById('tabContent').innerHTML=h;}
async function setOrder(id,status){const {error}=await sb.from('orders').update({status}).eq('id',id);if(error){toast('操作失败：'+error.message);return;}toast('已更新');await loadAll();}
function renderComments(){const T={pending:'待审核',approved:'已通过',rejected:'已拒绝'},C={pending:'st-pending',approved:'st-paid',rejected:'st-cancelled'};let h=`<div class="bar"><h3>评论 ${comments.length}</h3></div>`;if(!comments.length)h+='<div class="empty">暂无评论</div>';else h+=comments.map(c=>{const p=prodMap[c.product_id];let a='';if(c.status==='pending')a=`<button class="btn btn-accent sm" onclick="setComment(${c.id},'approved')">通过</button><button class="btn btn-ghost sm" onclick="setComment(${c.id},'rejected')">拒绝</button>`;else if(c.status==='approved')a=`<button class="btn btn-ghost sm" onclick="setComment(${c.id},'rejected')">下架</button>`;else a=`<button class="btn btn-ghost sm" onclick="setComment(${c.id},'approved')">恢复</button>`;a+=`<button class="btn btn-ghost sm" onclick="delComment(${c.id})">删除</button>`;return `<div class="oi"><div class="oh"><span class="ot">${esc(p?p.title:'产品已删除')}</span><span class="st ${C[c.status]||''}">${T[c.status]||c.status}</span></div><div class="om">${esc(c.content)}<br>${new Date(c.created_at).toLocaleString('zh-CN')}</div><div class="oa">${a}</div></div>`;}).join('');document.getElementById('tabContent').innerHTML=h;}
async function setComment(id,status){const {error}=await sb.from('comments').update({status}).eq('id',id);if(error){toast('操作失败');return;}toast('已更新');await loadAll();}
async function delComment(id){if(!confirm('确定删除这条评论吗？'))return;const {error}=await sb.from('comments').delete().eq('id',id);if(error){toast('删除失败');return;}toast('已删除');await loadAll();}
/* ===== 会员 ===== */
function renderMembership(){const T={pending:'待付款',submitted:'待确认',paid:'已开通',cancelled:'已取消'},C={pending:'st-pending',submitted:'st-submitted',paid:'st-paid',cancelled:'st-cancelled'};let h=`<div class="bar"><h3>会员订单 ${membershipOrders.length}</h3></div><div class="card"><b>会员套餐</b><div style="font-size:12.5px;color:var(--muted);line-height:1.9;margin-top:5px">${plans.map(p=>`${esc(p.name)}：¥${p.price} / ${p.duration_days}天`).join('<br>')}</div></div>`;if(!membershipOrders.length)h+='<div class="empty">暂无会员订单</div>';else h+=membershipOrders.map(o=>{const plan=plans.find(p=>p.id===o.plan_id);const email=profilesMap[o.user_id]||'...';let a='';if(o.status==='submitted')a=`<button class="btn btn-accent sm" onclick="confirmMember(${o.id})">确认收款并开通</button><button class="btn btn-ghost sm" onclick="setMember(${o.id},'cancelled')">取消</button>`;else if(o.status==='pending')a=`<button class="btn btn-ghost sm" onclick="setMember(${o.id},'cancelled')">取消</button>`;else if(o.status==='paid')a=`<button class="btn btn-ghost sm" onclick="setMember(${o.id},'cancelled')">撤销</button>`;return `<div class="oi"><div class="oh"><span class="ot">${esc(plan?plan.name:'套餐已删除')} · ¥${o.amount}</span><span class="st ${C[o.status]||''}">${T[o.status]||o.status}</span></div><div class="om">#${o.id} / 买家：${esc(email)}<br>${new Date(o.created_at).toLocaleString('zh-CN')}</div>${a?`<div class="oa">${a}</div>`:''}</div>`;}).join('');document.getElementById('tabContent').innerHTML=h;}
async function setMember(id,status){const {error}=await sb.from('membership_orders').update({status}).eq('id',id);if(error){toast('操作失败');return;}toast('已更新');await loadAll();}
async function confirmMember(id){const o=membershipOrders.find(x=>x.id===id);if(!o){toast('订单不存在');return;}const plan=plans.find(p=>p.id===o.plan_id);const days=plan?plan.duration_days:30;const {data:prof}=await sb.from('profiles').select('*').eq('id',o.user_id).maybeSingle();const now=new Date();const base=prof&&prof.membership_expires_at&&new Date(prof.membership_expires_at)>now?new Date(prof.membership_expires_at):now;const exp=new Date(base.getTime()+days*86400000);const {error:e1}=await sb.from('membership_orders').update({status:'paid'}).eq('id',id);if(e1){toast('订单更新失败：'+e1.message);return;}const {error:e2}=await sb.from('profiles').update({membership_expires_at:exp.toISOString()}).eq('id',o.user_id);if(e2){toast('会员时长更新失败：'+e2.message);return;}toast('已开通会员');await loadAll();}
/* ===== 投票 ===== */
function renderPolls(){let h=`<div class="bar"><h3>投票 ${polls.length}</h3><button class="btn btn-accent" onclick="togglePollForm()">+ 新建投票</button></div><div id="pollForm" class="card" style="display:none"><b>新建投票</b><label>标题</label><input id="pollTitle"><label>描述（可选）</label><input id="pollDesc"><label>选项（每行一个，至少 2 个）</label><textarea id="pollOpts" placeholder="选项1&#10;选项2&#10;选项3"></textarea><button class="btn btn-accent" style="margin-top:10px" onclick="createPoll()">创建</button></div>`;if(!polls.length)h+='<div class="empty">暂无投票</div>';else h+=polls.map(p=>{const opts=pollOptions.filter(o=>o.poll_id===p.id);const total=opts.reduce((s,o)=>s+(o.votes||0),0);return `<div class="oi"><div class="oh"><span class="ot">${esc(p.title)}</span><span class="st ${p.status==='active'?'st-paid':'st-cancelled'}">${p.status==='active'?'进行中':'已结束'}</span></div><div class="om">${opts.map(o=>`${esc(o.label)}：${o.votes||0} 票`).join('<br>')||'暂无选项'}<br>总票数：${total}</div><div class="oa"><button class="btn btn-ghost sm" onclick="closePoll(${p.id})">结束投票</button><button class="btn btn-ghost sm" onclick="delPoll(${p.id})">删除</button></div></div>`;}).join('');document.getElementById('tabContent').innerHTML=h;}
function togglePollForm(){const f=document.getElementById('pollForm');f.style.display=f.style.display==='none'?'block':'none';}
async function createPoll(){const title=document.getElementById('pollTitle').value.trim();const desc=document.getElementById('pollDesc').value.trim();const opts=document.getElementById('pollOpts').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!title||opts.length<2){toast('请填写标题和至少2个选项');return;}const {data:p,error}=await sb.from('polls').insert({title,description:desc,status:'active'}).select().single();if(error){toast('创建失败：'+error.message);return;}for(const label of opts){await sb.from('poll_options').insert({poll_id:p.id,label,votes:0});}toast('已创建');await loadAll();}
async function closePoll(id){const {error}=await sb.from('polls').update({status:'closed'}).eq('id',id);if(error){toast('操作失败');return;}toast('已结束');await loadAll();}
async function delPoll(id){if(!confirm('确定删除这个投票吗？'))return;await sb.from('poll_options').delete().eq('poll_id',id);await sb.from('poll_votes').delete().eq('poll_id',id);const {error}=await sb.from('polls').delete().eq('id',id);if(error){toast('删除失败');return;}toast('已删除');await loadAll();}
/* ===== 投稿 ===== */
function renderSubmissions(){const T={pending:'待审核',approved:'已通过',rejected:'已拒绝'},C={pending:'st-pending',approved:'st-paid',rejected:'st-cancelled'};let h=`<div class="bar"><h3>投稿 ${submissions.length}</h3></div>`;if(!submissions.length)h+='<div class="empty">暂无投稿</div>';else h+=submissions.map(s=>{const email=profilesMap[s.user_id]||'...';let a='';if(s.status==='pending')a=`<button class="btn btn-accent sm" onclick="setSub(${s.id},'approved')">通过</button><button class="btn btn-ghost sm" onclick="setSub(${s.id},'rejected')">拒绝</button>`;else if(s.status==='approved')a=`<button class="btn btn-ghost sm" onclick="setSub(${s.id},'rejected')">下架</button>`;else a=`<button class="btn btn-ghost sm" onclick="setSub(${s.id},'approved')">恢复</button>`;a+=`<button class="btn btn-ghost sm" onclick="delSub(${s.id})">删除</button>`;return `<div class="oi"><div class="oh"><span class="ot">${esc(s.title)}</span><span class="st ${C[s.status]||''}">${T[s.status]||s.status}</span></div><div class="om">${esc(s.description||'')}<br>投稿人：${esc(email)}${s.file_url?'<br>链接：'+esc(s.file_url):''}<br>${new Date(s.created_at).toLocaleString('zh-CN')}</div><div class="oa">${a}</div></div>`;}).join('');document.getElementById('tabContent').innerHTML=h;}
async function setSub(id,status){const {error}=await sb.from('submissions').update({status}).eq('id',id);if(error){toast('操作失败');return;}toast('已更新');await loadAll();}
async function delSub(id){if(!confirm('确定删除这条投稿吗？'))return;const {error}=await sb.from('submissions').delete().eq('id',id);if(error){toast('删除失败');return;}toast('已删除');await loadAll();}
/* ===== FAQ / 设置 ===== */
function initFaqRows(){try{faqRows=JSON.parse(settings.faq_json||'[]');}catch(e){faqRows=[];}if(!Array.isArray(faqRows)||!faqRows.length){const raw=settings.faq_text||'';faqRows=raw.split('\n').filter(Boolean).map(line=>{const i=line.indexOf('|');return i<0?{q:line.trim(),a:''}:{q:line.slice(0,i).trim(),a:line.slice(i+1).trim()};});}if(!faqRows.length)faqRows=[{q:'',a:''}];}
function renderFaqRows(){const box=document.getElementById('faqRows');if(!box)return;box.innerHTML=faqRows.map((r,i)=>`<div class="faq-row"><label>问题 ${i+1}</label><input class="faq-q" data-i="${i}" value="${esc(r.q)}"><label>答案 ${i+1}</label><textarea class="faq-a" data-i="${i}">${esc(r.a)}</textarea><button class="del" onclick="delFaqRow(${i})">删除这一条</button></div>`).join('');}
function syncFaqRows(){document.querySelectorAll('#faqRows .faq-q').forEach(el=>{faqRows[+el.dataset.i].q=el.value;});document.querySelectorAll('#faqRows .faq-a').forEach(el=>{faqRows[+el.dataset.i].a=el.value;});}
function addFaqRow(){syncFaqRows();faqRows.push({q:'',a:''});renderFaqRows();}
function delFaqRow(i){syncFaqRows();faqRows.splice(i,1);if(!faqRows.length)faqRows=[{q:'',a:''}];renderFaqRows();}
function renderSettings(){if(!faqRows.length)initFaqRows();const fh=(k,l,t)=>t==='textarea'?`<label>${l}</label><textarea id="f_${k}">${esc(settings[k]||'')}</textarea>`:`<label>${l}</label><input id="f_${k}" value="${esc(settings[k]||'')}">`;const texts=TEXT_FIELDS.map(([k,l,t])=>fh(k,l,t)).join('');const toggles=TOGGLE_FIELDS.map(([k,l])=>`<label style="display:flex;align-items:center;gap:8px;margin:10px 0"><input type="checkbox" id="t_${k}" ${settings[k]==='0'?'':'checked'}> ${l}</label>`).join('');const fs=[['system','系统默认'],['heiti','黑体'],['songti','宋体'],['kaiti','楷体'],['yuanti','圆体']].map(([v,t])=>`<option value="${v}"${settings.theme_font===v?' selected':''}>${t}</option>`).join('');const qw=settings.pay_qr_wechat||'',qa=settings.pay_qr_alipay||'';document.getElementById('tabContent').innerHTML=`<div class="bar"><h3>站点设置</h3></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b>区块开关</b><div style="display:flex;gap:6px"><button class="btn btn-ghost sm" onclick="allToggles(true)">全显示</button><button class="btn btn-ghost sm" onclick="allToggles(false)">全隐藏</button></div></div>${toggles}</div><div class="card"><b>页面文字</b>${texts}</div><div class="card"><b>常见问题</b><div class="hint" style="margin:6px 0 10px">每条一个问题+一个答案</div><div id="faqRows"></div><button class="btn btn-ghost sm" onclick="addFaqRow()">+ 添加一条</button></div><div class="card"><b>主题外观</b><label>主色调</label><div class="cr"><input type="color" id="sAccent" value="${esc(settings.theme_accent||'#c8f62e')}"></div><label>背景色</label><div class="cr"><input type="color" id="sBg" value="${esc(settings.theme_bg||'#0b0b0c')}"></div><label>文字颜色</label><div class="cr"><input type="color" id="sText" value="${esc(settings.theme_text||'#f4f4f2')}"></div><label>字体</label><select id="sFont">${fs}</select></div><div class="card"><b>图片和字体</b><label>Logo</label><input type="file" accept="image/*" onchange="uploadAsset('logo',this)" style="padding:7px">${settings.logo_url?`<img src="${esc(settings.logo_url)}" class="pv" style="display:block">`:''}<label>首页大图</label><input type="file" accept="image/*" onchange="uploadAsset('hero',this)" style="padding:7px">${settings.hero_bg_url?`<img src="${esc(settings.hero_bg_url)}" class="pv" style="display:block">`:''}<label>网站图标</label><input type="file" accept="image/*" onchange="uploadAsset('favicon',this)" style="padding:7px"><label>字体文件</label><input type="file" accept=".woff2,.woff,.ttf,.otf" onchange="uploadAsset('font',this)" style="padding:7px"></div><div class="card"><b>收款码</b><label>微信</label><input type="file" id="qrW" accept="image/*" onchange="uploadQR('wechat')" style="padding:7px"><label>支付宝</label><input type="file" id="qrA" accept="image/*" onchange="uploadQR('alipay')" style="padding:7px"><div class="qp">${qw?`<img src="${esc(qw)}">`:''}${qa?`<img src="${esc(qa)}">`:''}</div></div><div class="card"><b>备份</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn btn-ghost" onclick="exportData()">导出</button><label class="btn btn-ghost" style="margin:0;cursor:pointer">导入<input type="file" accept=".json,application/json" onchange="importData(this)" style="display:none"></label></div></div><button class="btn btn-accent" style="width:100%;padding:12px" onclick="saveSettings()">保存全部设置</button>`;renderFaqRows();}
function allToggles(on){document.querySelectorAll('#tabContent input[type=checkbox]').forEach(c=>c.checked=on);}
async function saveSettings(){const rows=[];TEXT_FIELDS.forEach(([k])=>{const el=document.getElementById('f_'+k);if(el)rows.push({key:k,value:el.value});});TOGGLE_FIELDS.forEach(([k])=>{const el=document.getElementById('t_'+k);if(el)rows.push({key:k,value:el.checked?'1':'0'});});syncFaqRows();const clean=faqRows.map(r=>({q:(r.q||'').trim(),a:(r.a||'').trim()})).filter(r=>r.q);rows.push({key:'faq_json',value:JSON.stringify(clean)});rows.push({key:'theme_accent',value:document.getElementById('sAccent').value});rows.push({key:'theme_bg',value:document.getElementById('sBg').value});rows.push({key:'theme_text',value:document.getElementById('sText').value});rows.push({key:'theme_font',value:document.getElementById('sFont').value});const {error}=await sb.from('settings').upsert(rows);if(error){toast('保存失败：'+error.message);return;}toast('已保存');faqRows=[];await loadAll();}
async function uploadQR(type){const input=document.getElementById(type==='wechat'?'qrW':'qrA'),f=input.files[0];if(!f)return;toast('上传中...');const path='qr_'+type+'_'+Date.now()+'.'+f.name.split('.').pop();const {error}=await sb.storage.from('covers').upload(path,f,{upsert:true});if(error){toast('上传失败：'+error.message);return;}const {data}=sb.storage.from('covers').getPublicUrl(path);const key=type==='wechat'?'pay_qr_wechat':'pay_qr_alipay';await sb.from('settings').upsert([{key,value:data.publicUrl}]);settings[key]=data.publicUrl;toast('已更新');renderSettings();}
async function uploadAsset(type,input){const f=input.files[0];if(!f)return;toast('上传中...');const path=type+'_'+Date.now()+'.'+f.name.split('.').pop();const {error}=await sb.storage.from('covers').upload(path,f,{upsert:true});if(error){toast('上传失败：'+error.message);return;}const {data}=sb.storage.from('covers').getPublicUrl(path);const key={logo:'logo_url',hero:'hero_bg_url',favicon:'favicon_url',font:'font_url'}[type];await sb.from('settings').upsert([{key,value:data.publicUrl}]);settings[key]=data.publicUrl;toast('已更新');renderSettings();}
async function exportData(){const [s,p]=await Promise.all([sb.from('settings').select('*'),sb.from('products').select('*')]);const blob=new Blob([JSON.stringify({settings:s.data||[],products:p.data||[]},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_'+Date.now()+'.json';document.body.appendChild(a);a.click();a.remove();toast('已导出');}
async function importData(input){const f=input.files[0];if(!f)return;if(!confirm('导入会覆盖同名数据，确定？'))return;try{const obj=JSON.parse(await f.text());if(obj.settings?.length)await sb.from('settings').upsert(obj.settings.map(r=>({key:r.key,value:r.value})));if(obj.products?.length)await sb.from('products').upsert(obj.products);toast('导入成功');await loadAll();}catch(e){toast('导入失败：'+e.message);}}
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台</title>
<style>
:root{--bg:#0b0b0c;--panel:#141416;--panel2:#1b1b1e;--line:rgba(255,255,255,.09);--text:#f4f4f2;--muted:#9c9ca6;--accent:#c8f62e}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
a{color:inherit;text-decoration:none}.container{max-width:1000px;margin:0 auto;padding:0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:8px;font-size:13px;padding:8px 14px;white-space:nowrap}
.btn-accent{background:var(--accent);color:#000}.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12px}
input,select,textarea{width:100%;padding:9px 11px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;outline:none}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--muted);margin:11px 0 5px}
textarea{min-height:70px;resize:vertical}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#000;padding:11px 20px;border-radius:8px;font-weight:700;font-size:13px;z-index:999;transition:.3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 22px;width:100%;max-width:350px}
.login-card h1{font-size:17px;font-weight:700;margin-bottom:16px}
#panelView{display:none;padding-bottom:50px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(11,11,12,.95);border-bottom:1px solid var(--line);padding:11px 0}
.topbar .inner{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px}.who{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:5px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line)}
.tab{padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
main{padding:16px 0}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar h3{font-size:16px;font-weight:700}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px}
.sc .n{font-size:24px;font-weight:700}.sc .n.a{color:var(--accent)}
.sc .l{font-size:12px;color:var(--muted);margin-top:2px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px}
.pc{width:46px;height:46px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0;color:#fff;overflow:hidden;background-size:cover;background-position:center}
.pi{flex:1;min-width:0}.pt{font-weight:600;font-size:13.5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:11px;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:36px 0;font-size:13px}
.oi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:8px}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ot{font-weight:600;font-size:13.5px}.om{font-size:11.5px;color:var(--muted);line-height:1.7;white-space:pre-wrap}
.oa{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.st{font-size:10.5px;padding:2px 8px;border-radius:5px;font-weight:600;white-space:nowrap}
.st-pending{background:rgba(255,180,0,.15);color:#ffb400}
.st-paid{background:rgba(200,246,46,.15);color:#c8f62e}
.st-grey{background:rgba(255,255,255,.08);color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px;margin-bottom:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cr{display:flex;gap:9px;align-items:center}
.cr input[type=color]{width:50px;height:40px;padding:3px;flex-shrink:0}
.pv{width:100%;max-width:220px;border-radius:6px;margin-top:7px;display:none;border:1px solid var(--line)}
.cp{width:110px;height:72px;object-fit:cover;border-radius:6px;margin-top:6px;display:none;border:1px solid var(--line)}
.imgs-prev{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.imgs-prev img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.qp{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.qp img{width:90px;height:90px;object-fit:contain;background:#fff;border-radius:6px;padding:4px}
.hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55}
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;pointer-events:none;transition:.25s}
.modal.show{opacity:1;pointer-events:auto}
.mb{position:absolute;inset:0;background:rgba(0,0,0,.85)}
.mbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:20px}
.mbox h3{font-size:16px;font-weight:700;margin-bottom:6px}
.mc{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
@media(max-width:560px){.g2{grid-template-columns:1fr}.sg{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="loginView"><div class="login-card">
<h1>管理后台</h1>
<label>邮箱</label><input type="email" id="loginEmail">
<label>密码</label><input type="password" id="loginPass">
<button class="btn btn-accent" style="width:100%;margin-top:16px" onclick="doLogin()">登录</button>
<div style="text-align:center;margin-top:12px;font-size:12px"><a href="index.html" style="color:var(--muted)">返回前台</a></div>
</div></div>

<div id="panelView">
<div class="topbar"><div class="container inner">
<div class="brand">管理后台</div>
<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span class="who" id="whoEmail"></span><a href="index.html" target="_blank" class="btn btn-ghost sm">前台</a><button class="btn btn-ghost sm" onclick="logout()">退出</button></div>
</div></div>
<div class="container">
<div class="tabs">
<button class="tab active" data-tab="overview" onclick="switchTab('overview')">概览</button>
<button class="tab" data-tab="products" onclick="switchTab('products')">产品</button>
<button class="tab" data-tab="orders" onclick="switchTab('orders')">订单</button>
<button class="tab" data-tab="comments" onclick="switchTab('comments')">评论</button>
<button class="tab" data-tab="settings" onclick="switchTab('settings')">设置</button>
</div>
<main id="tabContent"></main>
</div></div>

<div class="modal" id="pModal" onclick="if(event.target===this||event.target.classList.contains('mb'))closePF()">
<div class="mb"></div><div class="mbox">
<button class="mc" onclick="closePF()">X</button>
<h3 id="pTitle">新增产品</h3>
<label>产品名称</label><input id="fTitle">
<div class="g2">
<div><label>分类</label><select id="fCategory"><option>预设</option><option>工程文件</option><option>模板</option><option>调色LUT</option><option>转场</option></select></div>
<div><label>状态</label><select id="fStatus"><option value="published">上架</option><option value="hidden">下架</option></select></div>
</div>
<div class="g2">
<div><label>价格（0=免费）</label><input id="fPrice" type="number" min="0" step="0.01" value="0"></div>
<div><label>原价</label><input id="fOldPrice" type="number" min="0" step="0.01"></div>
</div>
<label>视频链接（B站/YouTube 嵌入链接，可选）</label><input id="fVideo">
<label>产品图片（可多选）</label><input type="file" id="fImages" accept="image/*" multiple style="padding:7px">
<div class="imgs-prev" id="imgsPrev"></div>
<div class="hint" id="imgHint">支持多选，第一张作封面</div>
<label>单张封面（可选）</label><input type="file" id="fCover" accept="image/*" style="padding:7px">
<img id="coverPrev" class="cp">
<div class="g2">
<div><label>封面大字（无图时）</label><input id="fGlyph"></div>
<div><label>封面颜色（无图时）</label><input id="fColor" type="color" value="#1b1b1e" style="height:40px;padding:3px"></div>
</div>
<label>产品介绍</label><textarea id="fDesc"></textarea>
<label>预设文件</label><input type="file" id="fFile" style="padding:7px">
<div class="hint" id="fFileInfo"></div>
<button class="btn btn-accent" style="width:100%;margin-top:16px" onclick="saveProduct()" id="saveBtn">保存</button>
</div></div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
